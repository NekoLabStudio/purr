<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Purr logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E886"/>
      <stop offset="1" stop-color="#E9D155"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE5D5"/>
    </linearGradient>
    <linearGradient id="cocoa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A7266"/>
      <stop offset="1" stop-color="#4F3E36"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26272F"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#5C4A00" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Box -->
  <g filter="url(#shadow)">
    <polygon points="256,104 392,180 256,256 120,180" fill="url(#cream)"/>
    <polygon points="120,180 256,256 256,412 120,336" fill="url(#ink)"/>
    <polygon points="392,180 256,256 256,412 392,336" fill="url(#cocoa)"/>
    <polyline points="120,180 256,104 392,180" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
