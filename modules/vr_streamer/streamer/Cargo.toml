[package]
name = "vr_streamer"
version = "0.1.0"
edition = "2021"
publish = false

# macOS only (src/main.rs): elsewhere, players use their own OpenXR runtime.
[dependencies]
anyhow = "1"
serde_json = "1"
log = { version = "0.4", features = ["std"] }
memmap2 = "0.9"
parking_lot = "0.12"
libc = "0.2"
# VideoToolbox and the game audio tap.
objc2-video-toolbox = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2 = "0.6"
objc2-core-audio = "0.3.2"
objc2-foundation = "0.3.2"
cpal = "0.15"
# The Steam Link host (src/steam_link): pairing's key exchange and Steam's symmetric scheme.
aes = "0.9"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
getrandom = "0.3"

[profile.release]
debug = "limited"
